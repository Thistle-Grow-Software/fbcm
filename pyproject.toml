[project]
name = "fbcm"
version = "0.4.1"
description = "Command line tools for downloading and archiving (American) football content"
authors = [
    {name = "John Griebel", email = "john@thistlegrow.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "yt-dlp==2025.12.8",
    "click==8.3.1",
    "ffmpeg-python==0.2.0",
    "mutagen==1.47.0",
    "pycryptodomex==3.23.0",
    "griddy[browser-auth]>=0.46.1,<1.0",
    "pyyaml>=6.0",
    "python-docx==1.2.0",
    "Pillow==12.1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest==9.0.2",
    "pytest-cov>=6.0",
    "types-PyYAML",
    "types-requests",
    "types-beautifulsoup4",
]
docs = [
    "mkdocs>=1.6.0,<2.0",
    "mkdocs-material>=9.6.0,<10.0",
    "mkdocstrings[python]>=0.29.0,<1.0",
    "mike>=2.1.0,<3.0",
]

[project.scripts]
fbcm = "fbcm.fbcm:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=fbcm",
    "--cov-report=term-missing",
    "--cov-config=pyproject.toml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv]
index-url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "private-registry"
url = "https://thistle-grow-685711685350.d.codeartifact.us-east-1.amazonaws.com/pypi/griddy/simple/"
publish-url = "https://thistle-grow-685711685350.d.codeartifact.us-east-1.amazonaws.com/pypi/griddy/"
explicit = true

[tool.uv.sources]
griddy = { index = "private-registry" }

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fbcm"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "yt_dlp.*",
    "ffmpeg.*",
    "mutagen.*",
    "docx.*",
    "griddy.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

