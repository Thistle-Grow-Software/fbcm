name: Quality Gates

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  id-token: write
  contents: write

jobs:
  quality-gates:
    uses: Thistle-Grow-Software/.github/.github/workflows/python-quality-gates.yml@main
    with:
      needs-codeartifact: true
      uv-sync-args: "--extra dev"
      codecov-enabled: true
      codecov-slug: "Thistle-Grow-Software/fbcm"
    secrets:
      aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
      codeartifact-domain: ${{ secrets.CODEARTIFACT_DOMAIN }}
      codeartifact-domain-owner: ${{ secrets.CODEARTIFACT_DOMAIN_OWNER }}
      codecov-token: ${{ secrets.CODECOV_TOKEN }}

  release:
    if: github.ref == 'refs/heads/master'
    needs: [quality-gates]
    uses: Thistle-Grow-Software/.github/.github/workflows/create-release.yml@main
